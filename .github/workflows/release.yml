name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签（示例：v1.2.3）。留空将自动生成。"
        required: false
        type: string
      prerelease:
        description: "是否标记为预发布"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build macOS package
        run: |
          bash scripts/build_mac.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          if-no-files-found: error
          path: |
            release/mac/*.dmg
            release/mac/*.dmg.sha256
            dist/AutoPaperdownload.app

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_win.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          if-no-files-found: error
          path: |
            release/win/*.exe
            release/win/SHA256SUMS.txt

  release:
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -maxdepth 5 -type f | sort

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            input_tag="${{ inputs.release_tag }}"
            if [[ -n "${input_tag}" ]]; then
              tag="${input_tag}"
            else
              tag="manual-${GITHUB_RUN_NUMBER}"
            fi
            prerelease="${{ inputs.prerelease }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/mac-artifacts/*.dmg
            artifacts/mac-artifacts/*.dmg.sha256
            artifacts/win-artifacts/*.exe
            artifacts/win-artifacts/SHA256SUMS.txt
